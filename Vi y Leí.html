<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Deigo reseñas</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap"><style id="app-css">
/* Layout: encabezado con trama de puntos (screentone). Filtros a la izquierda y tarjetas con cartel a la derecha en pantallas anchas. */
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--surface-2:#F4F6F9;--ink:#151922;--muted:#596275;--line:#D5DBE4;
  --accent:#D7263D;--accent-ink:#FFFFFF;--accent-soft:#FBE3E6;--accent-text:#B01B30;--dot:rgba(215,38,61,.35);
  --focus:#1F5FD6;--scrim:rgba(14,17,24,.55);
  --t-serie:#3B6FD4;--t-pelicula:#B77900;--t-anime:#D13C7A;--t-manga:#151922;--t-manhwa:#17936F;--t-libro:#7C5CD1;--t-juego:#D9702A;--t-otro:#7A8497;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --text:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1118;--surface:#171B25;--surface-2:#1E2330;--ink:#E9ECF2;--muted:#9BA5B8;--line:#2B3242;
    --accent:#FF5468;--accent-ink:#14060A;--accent-soft:#3A1820;--accent-text:#FF8A98;--dot:rgba(255,84,104,.32);
    --focus:#7FA6FF;--scrim:rgba(0,0,0,.65);
    --t-serie:#6F9BEF;--t-pelicula:#E0A93A;--t-anime:#F06BA1;--t-manga:#E9ECF2;--t-manhwa:#3FC79F;--t-libro:#A68BF0;--t-juego:#F0904A;--t-otro:#8F9AAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1118;--surface:#171B25;--surface-2:#1E2330;--ink:#E9ECF2;--muted:#9BA5B8;--line:#2B3242;
  --accent:#FF5468;--accent-ink:#14060A;--accent-soft:#3A1820;--accent-text:#FF8A98;--dot:rgba(255,84,104,.32);
  --focus:#7FA6FF;--scrim:rgba(0,0,0,.65);
  --t-serie:#6F9BEF;--t-pelicula:#E0A93A;--t-anime:#F06BA1;--t-manga:#E9ECF2;--t-manhwa:#3FC79F;--t-libro:#A68BF0;--t-juego:#F0904A;--t-otro:#8F9AAE;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.55 var(--text);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin-inline:auto}

/* Encabezado */
.masthead{position:relative;isolation:isolate;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:32px 24px}
.masthead::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.7px);background-size:10px 10px;
  -webkit-mask-image:radial-gradient(ellipse 80% 120% at 100% 0,#000,transparent 70%);
  mask-image:radial-gradient(ellipse 80% 120% at 100% 0,#000,transparent 70%);
}
.mh-text{flex:1 1 320px;min-width:0}
.mh-actions{display:flex;flex-wrap:wrap;gap:10px}
h1{margin:0;font:800 clamp(46px,12vw,78px)/.95 var(--display);letter-spacing:-.035em;overflow-wrap:anywhere;text-wrap:balance}
h1.long{font-size:clamp(34px,8.5vw,58px);line-height:1}
.lede{margin:12px 0 0;max-width:46ch;color:var(--muted);font-size:16px}
.statline{margin:8px 0 0;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.vbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.vbar span{flex:1 1 260px;min-width:0}
.howto{margin:0 0 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.howto summary{min-height:44px;padding:10px 14px;font-weight:600;cursor:pointer}
.howto-body{max-width:68ch;padding:0 14px 14px;color:var(--muted)}
.howto-body p{margin:8px 0 0}
.howto-body b{color:var(--ink)}
.howto-body a{color:var(--accent-text)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;text-align:center}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-danger{background:transparent;color:var(--accent-text);border-color:var(--accent)}
.btn-danger[data-armed]{background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.06)}
.is-busy{pointer-events:none;opacity:.65}

/* Distribución */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:860px){
  .layout{grid-template-columns:268px minmax(0,1fr);gap:32px}
  .filters{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
}

/* Filtros */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.grp{margin:0 0 16px}
.grp:last-child{margin-bottom:0}
.lbl{display:block;margin:0 0 8px;font:600 11.5px/1.2 var(--text);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-size:16px;line-height:1.4}
textarea.in{min-height:120px;resize:vertical}
.selects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.selects>div{min-width:0}
.span2{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:13.5px;cursor:pointer}
.chip .n{margin-left:6px;opacity:.62;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tagbox summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;margin-bottom:0}
.tagbox summary::-webkit-details-marker{display:none}
.tagbox summary::after{content:"+";font-size:16px;line-height:1}
.tagbox[open] summary{margin-bottom:10px}
.tagbox[open] summary::after{content:"\2212"}
.muted{color:var(--muted);font-size:13.5px}

/* Lista */
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:12px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-weight:500}
.notice span{flex:1 1 240px;min-width:0}
.summary{margin:0 0 12px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
@media (min-width:520px){.card{grid-template-columns:128px minmax(0,1fr);gap:20px;padding:16px}}

/* Cartel con la nota encima */
.poster{--pc:var(--t-otro);position:relative;align-self:start;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--pc);color:var(--bg)}
.poster[data-type="Serie"]{--pc:var(--t-serie)}
.poster[data-type="Película"]{--pc:var(--t-pelicula)}
.poster[data-type="Anime"]{--pc:var(--t-anime)}
.poster[data-type="Manga"]{--pc:var(--t-manga)}
.poster[data-type="Manhwa"]{--pc:var(--t-manhwa)}
.poster[data-type="Libro"]{--pc:var(--t-libro)}
.poster[data-type="Juego"]{--pc:var(--t-juego)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(30px,9vw,40px)/1 var(--display);letter-spacing:-.02em;background-image:radial-gradient(color-mix(in srgb,currentColor 30%,transparent) 1.2px,transparent 1.5px);background-size:8px 8px}
.score{position:absolute;left:6px;bottom:6px;display:flex;align-items:baseline;gap:1px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--display);line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.score b{font-size:20px;font-weight:800}
.score i{font-style:normal;font-size:10px;font-weight:600;opacity:.75}
.tier-top{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tier-good{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text)}
.tier-mid{background:var(--surface);color:var(--ink)}
.tier-low{background:var(--surface);border-style:dashed;border-color:var(--muted);color:var(--muted)}

.main{min-width:0}
.title{margin:0;font:700 20px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.ex{display:inline-block;margin-left:8px;padding:1px 7px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);font:600 10.5px/1.6 var(--text);letter-spacing:.08em;text-transform:uppercase;vertical-align:3px}
.meta{display:flex;flex-wrap:wrap;gap:2px 0;list-style:none;margin:6px 0 0;padding:0;color:var(--muted);font-size:13.5px}
.meta li+li::before{content:"\00B7";margin-inline:8px}
.type{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.type::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--t-otro)}
.type[data-type="Serie"]::before{background:var(--t-serie)}
.type[data-type="Película"]::before{background:var(--t-pelicula)}
.type[data-type="Anime"]::before{background:var(--t-anime)}
.type[data-type="Manga"]::before{background:var(--t-manga)}
.type[data-type="Manhwa"]::before{background:var(--t-manhwa)}
.type[data-type="Libro"]::before{background:var(--t-libro)}
.type[data-type="Juego"]::before{background:var(--t-juego)}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:12px 0 0;padding:0}
.tag{min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:12.5px;cursor:pointer}
.tag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.readbtn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.readbtn .car{font-size:12px;transition:transform .15s}
.readbtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.readbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.rv{margin:12px 0 0;padding:12px 14px;border-radius:6px;background:var(--surface-2)}
.text{margin:0;max-width:65ch;white-space:pre-line;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.date{color:var(--muted);font-size:12.5px}
.acts{display:flex;gap:2px;margin-left:auto}
.act{min-height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.act:hover{background:var(--surface-2)}
.act[data-action="edit"]{padding:0 12px;border:1px solid var(--line);text-decoration:none}
.empty{padding:32px 20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.empty h2{margin:0 0 6px;color:var(--ink);font:700 20px/1.2 var(--display)}
.empty p{margin:0 0 14px;max-width:46ch}

/* Hoja para agregar o editar */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-height:calc(100% - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:14px 14px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:560px;max-height:100%;border-radius:12px;padding:24px}
}
.sheet-title{margin:0 0 16px;font:800 26px/1.1 var(--display);letter-spacing:-.02em}
.field{display:grid;gap:0;margin:0 0 14px;min-width:0;border:0;padding:0}
.field .lbl{margin-bottom:6px;padding:0}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ratebox{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:center}
.ratebox input[type=range]{width:100%;min-height:44px;margin:0;accent-color:var(--accent)}
.posterpick{display:flex;gap:14px;align-items:center}
.pp-prev{flex:none;display:grid;place-items:center;width:64px;aspect-ratio:2/3;overflow:hidden;border:1px dashed var(--line);border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:11px;text-align:center}
.pp-prev img{display:block;width:100%;height:100%;object-fit:cover}
.pp-ctl{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.pp-ctl .muted{margin:0}
.filebtn{position:relative}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.filebtn input:focus-visible+span{outline:2px solid var(--focus);outline-offset:6px}
.check{display:flex;align-items:center;gap:10px;margin:0 0 14px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.err{margin:0 0 12px;color:var(--accent-text);font-weight:600}
.sheet-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sa-right{display:flex;gap:10px;margin-left:auto}

.toast{position:fixed;z-index:30;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;padding:12px 16px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600}

/* Filtrar y ordenar */
function match(r){
  if(ui.type&&r.type!==ui.type)return false;
  if(ui.status&&r.status!==ui.status)return false;
  if(ui.min&&r.rating<ui.min)return false;
  if(ui.tag&&!(r.tags||[]).some(function(t){return norm(t)===norm(ui.tag)}))return false;
  if(ui.q){
    var hay=norm([r.title,r.where,(r.tags||[]).join(' '),r.text].join(' '));
    if(hay.indexOf(norm(ui.q))<0)return false;
  }
  return true;
}
function cmp(a,b){
  var da=String(a.date||''),db=String(b.date||'');
  if(ui.sort==='best')return (b.rating-a.rating)||db.localeCompare(da);
  if(ui.sort==='az')return String(a.title).localeCompare(String(b.title),'es',{sensitivity:'base'});
  return db.localeCompare(da);
}

/* Cartel: se reduce para que la página siga liviana */
function readPoster(file){
  return new Promise(function(resolve,reject){
    if(!file||!/^image\//.test(file.type)){reject(new Error('type'));return}
    var fr=new FileReader();
    fr.onerror=function(){reject(new Error('read'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){reject(new Error('decode'))};
      img.onload=function(){
        try{
          var W=img.naturalWidth,H=img.naturalHeight;
          if(!W||!H){reject(new Error('decode'));return}
          var steps=[[360,540,.82],[300,450,.7],[240,360,.6]];
          var out='';
          for(var i=0;i<steps.length;i++){
            var sc=Math.min(steps[i][0]/W,steps[i][1]/H,1);
            var cv=document.createElement('canvas');
            cv.width=Math.max(1,Math.round(W*sc));
            cv.height=Math.max(1,Math.round(H*sc));
            var cx=cv.getContext('2d');
            cx.fillStyle='#ffffff';cx.fillRect(0,0,cv.width,cv.height);
            cx.drawImage(img,0,0,cv.width,cv.height);
            out=cv.toDataURL('image/jpeg',steps[i][2]);
            if(out.length<140000)break;
          }
          resolve(out);
        }catch(e){reject(e)}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function setBusy(on){root.classList.toggle('is-busy',on);root.setAttribute('aria-busy',on?'true':'false')}
function lockReadOnly(){

  toast('Esta página está en modo lectura.');
}
function persist(next,okMsg,site){
  if(!api||locked){toast('No se puede guardar desde aquí.');return}
  setBusy(true);
  try{sessionStorage.setItem('vyl-toast',okMsg)}catch(e){}
  var doc;
  try{doc=buildDoc({v:1,reviews:next,site:cleanSite(site||S.site)})}catch(e){setBusy(false);toast('No se pudo guardar. Intenta de nuevo.');return}
  var guard=setTimeout(function(){setBusy(false)},15000);
  api.publish(doc).then(function(){
    /* La página se recarga sola con la versión nueva */
  }).catch(function(err){
    clearTimeout(guard);setBusy(false);
    try{sessionStorage.removeItem('vyl-toast')}catch(e){}
    var c=err&&err.code;
    if(c==='conflict'){toast('Alguien guardó antes. Se cargará la versión más reciente.')}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){lockReadOnly()}
    else if(c==='too_large'){toast('Ya no caben más reseñas en la página. Prueba con carteles más chicos.')}
    else if(c==='rate_limited'){toast('Vas muy rápido. Espera un momento e intenta otra vez.')}
    else{toast('No se pudo guardar. Intenta de nuevo.')}
  });
}

function armBtn(btn,label){
  if(btn.getAttribute('data-armed'))return true;
  var old=btn.textContent;
  btn.setAttribute('data-armed','1');btn.textContent=label;
  setTimeout(function(){if(btn.isConnected){btn.removeAttribute('data-armed');btn.textContent=old}},4000);
  return false;
}

function copyReview(r){
  var lines=[r.title+' ('+r.type+') · '+fmtNum(r.rating)+'/10'];
  var h=(r.tags||[]).map(function(t){return '#'+String(t).replace(/\s+/g,'')}).join(' ');
  if(h)lines.push(h);
  if(r.where)lines.push('Dónde: '+r.where);
  if(r.text&&!r.spoiler){lines.push('',r.text)}
  else if(r.text){lines.push('','(Mi reseña tiene spoilers, te la cuento aparte)')}
  var txt=lines.join('\n');
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    toast(ok?'Copiado para enviar':'No se pudo copiar');
  }
  try{
    navigator.clipboard.writeText(txt).then(function(){toast('Copiado para enviar')},fallback);
  }catch(e){fallback()}
}

/* Eventos */
root.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('overlay')){closeSheet();return}
  var t=e.target.closest('[data-action]');if(!t)return;
  var a=t.getAttribute('data-action'),id=t.getAttribute('data-id');
  if(a==='add'){openSheet(null)}
  else if(a==='edit'){openSheet(id)}
  else if(a==='close'){closeSheet()}
  else if(a==='copy'){var r=S.reviews.filter(function(x){return x.id===id})[0];if(r)copyReview(r)}
  else if(a==='read'){
    var open=!opened[id];opened[id]=open;
    t.setAttribute('aria-expanded',String(open));
    var lab=t.querySelector('.rl');if(lab)lab.textContent=readLabel(open,t.hasAttribute('data-spoiler'));
    var pn=document.getElementById('rv-'+id);if(pn)pn.hidden=!open;
  }
  else if(a==='type'){ui.type=t.getAttribute('data-value')||'';afterFilter()}
  else if(a==='tag'){var tg=t.getAttribute('data-tag');ui.tag=(ui.tag&&norm(ui.tag)===norm(tg))?'':tg;afterFilter()}
  else if(a==='clear'){ui.q='';ui.type='';ui.status='';ui.min=0;ui.tag='';afterFilter()}
  else if(a==='poster-clear'){formPoster='';updatePosterPrev()}
  else if(a==='visitor-on'){asVisitor=true;closeSheet();syncHeader();render();window.scrollTo(0,0)}
  else if(a==='visitor-off'){asVisitor=false;syncHeader();render()}
  else if(a==='export'){exportCopy()}
  else if(a==='site-edit'){openSiteSheet()}
  else if(a==='delete'){
    if(!armBtn(t,'Toca otra vez para eliminar'))return;
    persist(S.reviews.filter(function(x){return x.id!==id}),'Reseña eliminada');
  }
  else if(a==='clear-examples'){
    if(!armBtn(t,'Toca otra vez para borrar'))return;
    persist(S.reviews.filter(function(x){return !x.example}),'Ejemplos borrados');
  }
});
root.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){ui.q=e.target.value;afterFilter()}
  else if(id==='f-range'){$('#f-rating').value=String(parseFloat(e.target.value)).replace('.',',')}
  else if(id==='f-rating'){
    var txt=e.target.value.trim().replace(',','.');
    var n=Number(txt);
    if(txt!==''&&isFinite(n)&&n>=0&&n<=10)$('#f-range').value=String(n);
  }
});
root.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-poster'){
    var file=e.target.files&&e.target.files[0];
    if(!file)return;
    readPoster(file).then(function(d){formPoster=d;updatePosterPrev()}).catch(function(){
      showErr('No se pudo leer esa imagen. Prueba con un JPG o PNG.');
    });
    e.target.value='';
    return;
  }
  if(id==='status')ui.status=e.target.value;
  else if(id==='min')ui.min=parseInt(e.target.value,10)||0;
  else if(id==='sort')ui.sort=e.target.value;
  else return;
  afterFilter();
});
root.addEventListener('submit',function(e){
  if(e.target.id==='site-form'){
    e.preventDefault();
    var st=$('#s-title').value.trim();
    if(!st){showErr('Escribe un nombre para la página.');$('#s-title').focus();return}
    persist(S.reviews,'Nombre y descripción guardados',{title:st,lede:$('#s-lede').value.trim()});
    return;
  }
  if(e.target.id!=='review-form')return;
  e.preventDefault();
  var form=e.target;
  var title=$('#f-title').value.trim();
  if(!title){showErr('Escribe el título.');$('#f-title').focus();return}
  var rawRating=$('#f-rating').value.trim().replace(',','.');
  var rating=Number(rawRating);
  if(rawRating===''||!isFinite(rating)||rating<0||rating>10){
    showErr('Escribe una nota entre 0 y 10. Puedes usar decimales, por ejemplo 8,5.');
    $('#f-rating').focus();return;
  }
  rating=Math.round(rating*10)/10;
  var id=form.getAttribute('data-id');
  var old=id?S.reviews.filter(function(x){return x.id===id})[0]:null;
  var tags=[];
  $('#f-tags').value.split(/[,#]/).forEach(function(t){
    t=t.trim().toLowerCase().slice(0,24);
    if(t&&tags.indexOf(t)<0&&tags.length<8)tags.push(t);
  });
  var entry={
    id:old?old.id:newId(),
    title:title.slice(0,120),
    type:$('#f-type').value,
    rating:rating,
    status:$('#f-status').value,
    tags:tags,
    text:$('#f-text').value.trim().slice(0,4000),
    spoiler:$('#f-spoiler').checked,
    date:(old&&old.date)||today()
  };
  var y=parseInt($('#f-year').value,10);if(y>=1900&&y<=2100)entry.year=y;
  var w=$('#f-where').value.trim().slice(0,60);if(w)entry.where=w;
  if(formPoster)entry.poster=formPoster;
  var next;
  if(old){next=S.reviews.map(function(x){return x.id===old.id?entry:x})}
  else{next=[entry].concat(S.reviews)}
  persist(next,old?'Reseña actualizada':'Reseña guardada');
});
document.addEventListener('keydown',function(e){
  var ov=$('.overlay');if(!ov)return;
  if(e.key==='Escape'){closeSheet();return}
  if(e.key!=='Tab')return;
  var f=all('button,input,select,textarea',ov).filter(function(x){return !x.disabled&&!x.hidden});
  if(!f.length)return;
  var first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});

/* Quién puede editar: se resuelve después. Sin permiso comprobado, la página queda como lectura */
(function(){
  var c=window.claude;
  if(!c||typeof c.use!=='function')return;
  Promise.all([
    c.use('artifact').catch(function(){return null}),
    c.use('user').catch(function(){return null}),
    c.use('downloads').catch(function(){return null})
  ]).then(function(res){
    api=res[0];dl=res[2];
    var u=res[1];
    var ok=false;
    if(u){try{ok=!!(u.canEdit()||u.isOwner())}catch(e){ok=false}}
    canEdit=!!(api&&ok);
    syncHeader();
    render();
  });
})();
})();
